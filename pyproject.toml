[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Enterprise-Grade Document Intelligence Platform using Baidu Unlimited-OCR, FastAPI, Celery, and Qdrant."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Enterprise AI Architecture Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "minio>=7.2.7",
    "qdrant-client>=1.9.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.3.0",
    "pymupdf>=1.24.0",
    "pdf2image>=1.17.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
