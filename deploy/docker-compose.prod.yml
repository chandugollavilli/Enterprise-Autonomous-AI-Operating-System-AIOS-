version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_prod_pass
      - POSTGRES_DB=document_intelligence
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
      - minio
      - qdrant
    restart: always

  celery_worker:
    build:
      context: ..
      dockerfile: Dockerfile.api
    command: celery -A src.infrastructure.celery.app.celery_app worker --loglevel=info -c 4
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_prod_pass
      - POSTGRES_DB=document_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_prod_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_prod_data:/qdrant/storage
    restart: always

volumes:
  postgres_prod_data:
  minio_prod_data:
  qdrant_prod_data:
